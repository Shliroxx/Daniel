# Veroeffentlicht den Hookah-Analyzer als Webseite auf GitHub Pages.
#
# Damit hat die App eine feste Adresse und laeuft auf dem Handy, ohne dass der
# PC an sein muss.
#
# Pages schaltet der Workflow selbst ein (enablement: true) — es ist also nichts
# von Hand zu klicken. Nur wenn das fehlschlaegt: Repository -> Settings -> Pages
# -> Source: "GitHub Actions".
# Achtung: fuer private Repositories braucht GitHub Pages einen bezahlten Tarif.
# Ohne den nimmst du Cloudflare Pages — Anleitung steht in der README.
#
# Der Ordner web/shisha wird unveraendert veroeffentlicht: kein Bauschritt,
# keine Abhaengigkeiten.

name: Analyzer veroeffentlichen

on:
  push:
    # Standard-Branch dieses Projekts plus die ueblichen Namen, falls er sich
    # mal aendert. Zusaetzlich laesst er sich in der Actions-Oberflaeche von
    # Hand starten.
    branches:
      - 'claude/jarvis-ki-tiktok-z4ew8c'
      - main
      - master
    paths:
      - 'web/shisha/**'
      - '.github/workflows/analyzer-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur eine Veroeffentlichung gleichzeitig, laufende nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    # Es gibt nur eine veroeffentlichte Seite. Von Hand aus einem Feature-Branch
    # gestartet wuerde dieser Lauf also ungeprueften Stand live schalten — und
    # sich mit der Veroeffentlichung des Standard-Branch um dieselbe Seite
    # streiten. Deshalb laeuft er nur auf dem Standard-Branch.
    if: github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Regelwerk pruefen
        run: node -e "JSON.parse(require('fs').readFileSync('web/shisha/spec.json','utf8'))"

      - name: Engine testen
        run: node tests/test_engine.mjs

      - name: Steuerlogik testen
        run: node tests/test_steuerung.mjs

      - name: Kompletten Durchgang durchspielen
        run: node tests/test_durchlauf.mjs
        timeout-minutes: 4

      - uses: actions/configure-pages@v5
        with:
          # Pages einschalten, falls es noch aus ist — spart den Gang in die
          # Einstellungen und macht den ersten Lauf selbsttragend.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/shisha

      - id: deployment
        uses: actions/deploy-pages@v4
