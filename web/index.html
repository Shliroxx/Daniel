<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#04080d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>JARVIS</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/static/hud.css" />
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>

  <header class="hud-top">
    <div class="brand">
      <span class="brand-mark">J.A.R.V.I.S</span>
      <span class="brand-sub" id="model-label">verbinde…</span>
    </div>
    <div class="link-status" id="link-status" data-state="down">
      <span class="dot"></span><span id="link-text">offline</span>
    </div>
  </header>

  <main class="stage">
    <!-- Reaktor -->
    <section class="reactor-wrap">
      <canvas id="viz" class="viz" width="640" height="640" aria-hidden="true"></canvas>
      <div class="reactor" id="reactor" data-state="idle">
        <div class="ring ring-outer"></div>
        <div class="ring ring-mid"></div>
        <div class="ring ring-inner"></div>
        <div class="core"></div>
      </div>
      <p class="state-label" id="state-label">Bereit</p>
      <p class="state-hint" id="state-hint">Sag „Hey Jarvis“ oder tippe unten</p>
    </section>

    <!-- Protokoll -->
    <section class="panel log-panel">
      <div class="panel-head">
        <h2>Verlauf</h2>
        <button class="ghost" id="btn-reset" type="button">Neu starten</button>
      </div>
      <div class="log" id="log"></div>
    </section>

    <!-- Aktivität -->
    <section class="panel activity-panel">
      <div class="panel-head"><h2>Aktivität</h2></div>
      <div class="activity" id="activity">
        <p class="muted">Noch nichts passiert.</p>
      </div>
    </section>
  </main>

  <footer class="hud-bottom">
    <button class="talk" id="btn-talk" type="button" aria-label="Sprechen (halten)">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"/>
        <path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.92V21a1 1 0 1 0 2 0v-3.08A7 7 0 0 0 19 11Z"/>
      </svg>
    </button>
    <form class="composer" id="composer">
      <input id="input" type="text" autocomplete="off" placeholder="Nachricht an Jarvis…" />
      <button type="submit" class="send">Senden</button>
    </form>
    <button class="ghost stop" id="btn-stop" type="button">Stopp</button>
  </footer>

  <audio id="player" hidden></audio>
  <script src="/static/hud.js"></script>
</body>
</html>
